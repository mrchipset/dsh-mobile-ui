# All-in-one deployment: STT + Bridge/DSH + Caddy + GateAway.
#
# Opt-in alternative to deploy/docker-compose.yml (which expects an already
# running external llm-gateaway_default network). Do not run both on the same
# host: the UI port and Gateway Postgres data volume would collide.
#
#   cd deploy
#   cp .env.example .env   # fill secrets if not already done
#   docker compose -f docker-compose.with-gateaway.yml config --services
#   docker compose -f docker-compose.with-gateaway.yml up -d
#
# Switch procedure: stop the dsh-mobile stack, stop the llm-gateaway stack,
# then start this file. The dsh-mobile_* volumes and llm-gateaway_pgdata are
# reused, so Bridge/DSH data and the existing Gateway client key survive.

name: dsh-mobile

x-gateway-logging: &gateway-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: gateway
    volumes:
      # Reuse the existing Gateway database (clients, keys, audit records).
      - gateaway-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *gateway-logging
    networks:
      - app

  migrate:
    image: llm-gateaway-backend:local
    build:
      context: ${GATEWAY_REPO:-../../LLM-GateAway}
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-gateway}@postgres:5432/gateway
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *gateway-logging
    networks:
      - app

  backend:
    image: llm-gateaway-backend:local
    build:
      context: ${GATEWAY_REPO:-../../LLM-GateAway}
      dockerfile: Dockerfile
    environment:
      GATEWAY_ENVIRONMENT: ${GATEWAY_ENVIRONMENT:-production}
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:-}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
      GATEWAY_STORAGE_BACKEND: postgres
      GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:${POSTGRES_PASSWORD:-gateway}@postgres:5432/gateway
      GATEWAY_OPENAI_API_KEY: ${GATEWAY_OPENAI_API_KEY:-}
      GATEWAY_OPENAI_BASE_URL: ${GATEWAY_OPENAI_BASE_URL:-https://api.openai.com/v1}
      GATEWAY_DEEPSEEK_API_KEY: ${GATEWAY_DEEPSEEK_API_KEY:-}
      GATEWAY_DEEPSEEK_BASE_URL: ${GATEWAY_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      GATEWAY_FAKE_PROVIDER_ENABLED: ${GATEWAY_FAKE_PROVIDER_ENABLED:-false}
      GATEWAY_REQUEST_TIMEOUT_SECONDS: ${GATEWAY_REQUEST_TIMEOUT_SECONDS:-60}
      GATEWAY_CONNECT_TIMEOUT_SECONDS: ${GATEWAY_CONNECT_TIMEOUT_SECONDS:-10}
      GATEWAY_MAX_RETRIES: ${GATEWAY_MAX_RETRIES:-2}
      GATEWAY_AUDIT_ENABLED: ${GATEWAY_AUDIT_ENABLED:-false}
      GATEWAY_AUDIT_MAX_CONTENT_BYTES: ${GATEWAY_AUDIT_MAX_CONTENT_BYTES:-262144}
      GATEWAY_AUDIT_WRITE_TIMEOUT_SECONDS: ${GATEWAY_AUDIT_WRITE_TIMEOUT_SECONDS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/healthz', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    logging: *gateway-logging
    networks:
      - app

  ui:
    image: llm-gateaway-ui:local
    build:
      context: ${GATEWAY_REPO:-../../LLM-GateAway}/ui
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_UI_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    logging: *gateway-logging
    networks:
      - app

  stt:
    image: funasr-openai-api:cpu-2026-10
    build:
      context: ./stt
      args:
        PYTHON_IMAGE: ${STT_PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        TORCH_VERSION: ${TORCH_VERSION:-2.6.0}
        FUNASR_REPO: ${FUNASR_REPO:-https://github.com/modelscope/FunASR.git}
        FUNASR_COMMIT: ${FUNASR_COMMIT:-d91d961e37a005837b1523bcc6b09f087877be54}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian-security}
    restart: unless-stopped
    volumes:
      - ./stt/models:/root/.cache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'', timeout=3).read()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s
    networks:
      - app

  bridge:
    build:
      context: ..
      dockerfile: deploy/bridge/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        PNPM_VERSION: ${PNPM_VERSION:-10.25.0}
        DSH_VERSION: ${DSH_VERSION:-0.2.1-rc.2}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian-security}
    image: dsh-mobile-bridge:local
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      BRIDGE_PORT: "8787"
      DSH_BIN: dsh
      DSH_ARGS: '["--profile","acp"]'
      DSH_HOME: /data/dsh
      HOME: /data/dsh
      WORKSPACE_ROOT: /workspace
      DB_PATH: /data/bridge.db
      STT_ENABLED: "true"
      STT_BASE_URL: http://stt:8000/v1
      STT_MODEL: paraformer
      FFMPEG_PATH: /usr/bin/ffmpeg
      NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    volumes:
      - bridge-data:/data
      - dsh-home:/data/dsh
      - ${WORKSPACE_PATH:-dsh-workspace}:/workspace
    depends_on:
      stt:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    networks:
      - app

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        CADDY_IMAGE: ${CADDY_IMAGE:-caddy:2-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        PNPM_VERSION: ${PNPM_VERSION:-10.25.0}
    image: dsh-mobile-web:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8443}:443"
    volumes:
      - ../.certs:/certs:ro
    depends_on:
      bridge:
        condition: service_healthy
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  bridge-data:
  dsh-home:
  dsh-workspace:
  gateaway-pgdata:
    external: true
    name: llm-gateaway_pgdata

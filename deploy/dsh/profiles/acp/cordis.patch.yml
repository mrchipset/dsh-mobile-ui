# ACP profile patch: route DSH through the LAN gateway.
# The patch is copied into $DSH_HOME/profiles/acp/cordis.patch.yml at startup.
# The key is read from GATEAWAY_API_KEY; never inline the secret here.
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      gateaway:
        displayName: GateAway
        apiKeyEnv: GATEAWAY_API_KEY
        api: openai-completions
        baseURL: http://backend:4000/v1
        models:
          - id: deepseek-flash
            name: deepseek-flash

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: gateaway
    model: deepseek-flash

- id: acp
  name: "@deepseek-ai/dsh-acp"
  inject: [acpAppStartup]
  config:
    provider: gateaway
    model: deepseek-flash

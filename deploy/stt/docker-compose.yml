# FunASR OpenAI-compatible API, CPU-first.
#
#   cd deploy/stt
#   docker compose up -d --build
#
# The service has no authentication. The default publication binds loopback
# only. See README.md before exposing it on the LAN.

services:
  stt:
    build:
      context: .
      args:
        # All build inputs are overridable via deploy/stt/.env. Defaults are
        # network-safe for this host: locally cached python 3.12, Tsinghua
        # PyPI, official torch CPU index, GitHub source.
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        TORCH_VERSION: ${TORCH_VERSION:-2.6.0}
        FUNASR_REPO: ${FUNASR_REPO:-https://github.com/modelscope/FunASR.git}
        FUNASR_COMMIT: ${FUNASR_COMMIT:-d91d961e37a005837b1523bcc6b09f087877be54}
    image: funasr-openai-api:cpu-2026-10
    restart: unless-stopped
    # CPU default. Set FUNASR_DEVICE=cuda and use a CUDA-capable image
    # (CUDA torch wheels + NVIDIA Container Toolkit) for a GPU host.
    ports:
      # Windows Docker Desktop / same host: http://127.0.0.1:8000
      # LAN GPU host: FUNASR_HOST_PORT=0.0.0.0:8000 (trusted networks only).
      - "${FUNASR_HOST_PORT:-127.0.0.1:8000}:8000"
    environment:
      FUNASR_DEVICE: cpu
      FUNASR_MODEL: paraformer
      FUNASR_PORT: "8000"
    volumes:
      # Persist ModelScope/Hugging Face downloads across container rebuilds.
      # On Windows this is a normal Docker Desktop bind mount.
      - ./models:/root/.cache
    shm_size: "2gb"
    healthcheck:
      # Cold start downloads model weights, so start_period is deliberately
      # long (15 min). /health proves the process is up; GET /v1/models shows
      # the server and pre-loaded alias are up, not per-model readiness.
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'', timeout=3).read()"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s


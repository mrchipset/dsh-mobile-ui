<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#060809" />
    <meta name="color-scheme" content="dark light" />
    <style>
      html {
        background: #060809;
      }
      html[data-theme="light"] {
        background: #efe9dc;
      }
    </style>
    <script>
      (() => {
        try {
          const key = 'dsh-mobile.theme'
          const stored = localStorage.getItem(key)
          const theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          const themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor !== null) {
            themeColor.setAttribute('content', theme === 'light' ? '#efe9dc' : '#060809')
          }
          const colorScheme = document.querySelector('meta[name="color-scheme"]')
          if (colorScheme !== null) colorScheme.setAttribute('content', theme)
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <meta
      name="description"
      content="DSH Mobile — 在手机上远程驾驶 DeepSeek Harness。会话、流式时间线、审批与写权都在掌心里。"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DSH" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>DSH Mobile</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
